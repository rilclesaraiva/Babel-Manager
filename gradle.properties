org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Preencher quando o repositório existir (formato dono/repo).
# Enquanto for OWNER/REPO, o aviso de atualização fica desligado e os links do app ficam ocultos.
babel.repo=OWNER/REPO
babel.developer=OWNER
